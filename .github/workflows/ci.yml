name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nimantran
          POSTGRES_PASSWORD: nimantran
          POSTGRES_DB: nimantran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimantran -d nimantran_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://nimantran:nimantran@localhost:5432/nimantran_test
      AUTH_SECRET: ci-test-auth-secret-not-for-production
      NEXT_PUBLIC_BRAND_DOMAIN: nimantran.app
      # Dev OTP path — no MSG91 in CI
      MSG91_AUTH_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production
